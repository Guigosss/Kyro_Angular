<div class="info" [routerLink]="['/session', session().id]">
  <strong>{{ session().nom }}</strong>
  <span class="meta">
    {{ session().date | date: 'dd/MM/yyyy' }} · {{ session().exercises.length }} exercise(s)
  </span>
</div>

<div class="actions">
  <a class="button" [routerLink]="['/sessions', session().id, 'edit']">Edit</a>
  <button type="button" class="danger" (click)="remove.emit()">Remove</button>
</div>
